name: Actualizar calendario

on:
  schedule:
    - cron: "0 5,11,17 * * *"   # 3 veces al día (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      COMPETITION_URL: https://www.fbpa.es/competicion-17433/competiciones-federadas-
      TEAM: GIJON BASKET 2015 CORPI
      CAL_NAME: Gijón Basket 2015 Corpi – Primera FBPA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fbpa_ics.py --url "$COMPETITION_URL" --team "$TEAM" --name "$CAL_NAME" --out docs/calendar.ics
      - name: Commit si hay cambios
        run: |
          if [[ -n "$(git status --porcelain docs/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add docs/calendar.ics
            git commit -m "calendar: actualización $(date -u +%F)"
            git push
          fi
